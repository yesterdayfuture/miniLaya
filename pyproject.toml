[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilaya"
version = "0.1.0"
description = "Fine-tune BERT into a Laya-style typed decision model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.19",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.scripts]
minilaya = "minilaya.cli:main"

[tool.setuptools.packages.find]
include = ["minilaya*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
